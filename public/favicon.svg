<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="vwOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9f43"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="vwBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fff5eb"/>
    </linearGradient>
    <filter id="vwShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#ea580c" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Rounded Square Container -->
  <rect width="512" height="512" rx="128" fill="url(#vwBgGrad)"/>
  <rect width="500" height="500" x="6" y="6" rx="122" fill="none" stroke="#f97316" stroke-width="8" stroke-opacity="0.2"/>

  <!-- VastuWheels Stylized 'W' Symbol -->
  <path d="M 96,140 L 176,380 L 256,230 L 336,380 L 416,140" 
        fill="none" 
        stroke="url(#vwOrangeGrad)" 
        stroke-width="54" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#vwShadow)"/>
  
  <!-- Central Diamond Sparkle accent -->
  <circle cx="256" cy="150" r="24" fill="#ea580c"/>
</svg>